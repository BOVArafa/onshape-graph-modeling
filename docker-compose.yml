services:
  api:
    build: .
    ports:
      - '${PORT:-3000}:3000'
    environment:
      PORT: 3000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?defina NEO4J_PASSWORD no arquivo .env}
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5.26
    ports:
      - '7474:7474'
      - '7687:7687'
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?defina NEO4J_PASSWORD no arquivo .env}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:7474 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  neo4j-data:
