name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:coverage

      - run: node scripts/generateTestReport.js
        if: always()

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-bdd-e-cobertura
          path: |
            reports/
            coverage/
          retention-days: 30
